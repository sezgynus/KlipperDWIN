name: Driver Branch Regression

on:
  push:
    branches:
      - master
      - refactor/t5uic1-complete-driver
      - feature/global-power-button
      - feature/mmu-menu

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GPIOZERO_PIN_FACTORY: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pyserial==3.5 websocket-client==1.9.2 Pillow==12.3.0 gpiozero==2.0.1.post3
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
